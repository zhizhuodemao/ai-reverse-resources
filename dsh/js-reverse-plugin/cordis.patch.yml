# dsh-js-reverse-plugin bundle layer: one insert that mounts the skills
# registrar and the js-reverse-mcp server. Applied after dsh-base, before the
# profile's own cordis.patch.yml.
- insert:
    - id: js-reverse-plugin
      name: 'dsh-js-reverse-plugin'
      inject: [skills]
    - id: mcp-js-reverse
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: stdio
        serverName: js-reverse
        command: npx
        args: ['-y', 'js-reverse-mcp@4.0.1']
