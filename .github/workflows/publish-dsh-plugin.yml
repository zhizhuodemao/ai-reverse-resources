name: Publish dsh bundles to npm

on:
  push:
    tags:
      - 'dsh-*-v*'

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # One row per plugin. Add a row for each new dsh/<package> bundle.
          - package: js-reverse-plugin
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Match tag to package
        id: select
        run: |
          if [[ "${{ github.ref_name }}" == "dsh-${{ matrix.package }}-v"* ]]; then
            echo "match=true" >> "$GITHUB_OUTPUT"
          else
            echo "match=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync skills from single source
        if: steps.select.outputs.match == 'true'
        working-directory: dsh/${{ matrix.package }}
        run: cp -R ../../plugins/${{ matrix.package }}/skills ./skills

      - name: Install dependencies
        if: steps.select.outputs.match == 'true'
        working-directory: dsh/${{ matrix.package }}
        run: npm install

      - name: Verify package contents
        if: steps.select.outputs.match == 'true'
        working-directory: dsh/${{ matrix.package }}
        run: npm pack --dry-run

      - name: Test DSH bundle
        if: steps.select.outputs.match == 'true'
        working-directory: dsh/${{ matrix.package }}
        run: npm test

      - name: Publish to npm
        if: steps.select.outputs.match == 'true'
        working-directory: dsh/${{ matrix.package }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
